[post_training.dataloader]
data_path = ""
set_name = "train"
val_set_name = "val"
num_vars = 11

[post_training]
learning_rate = 2.2e-5
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.98
per_device_train_batch_size = 8
gradient_accumulation_steps = 8
per_device_eval_batch_size = 1
num_generations = 128
num_generations_eval = 256
eval_generation_chunk_size = 4
train_generation_chunk_size = 8
offload_ref_model = true
gradient_checkpointing = true
steps_per_generation = 4
max_steps = 2000
max_completion_length = 512
beta = 0.0
temperature = 1.0
top_k = 0
top_p = 1.0
sample_temperature = 1.0
warmup_ratio = 0.05
lr_scheduler_type = "cosine"
save_steps = 250
eval_steps = 1000
logging_steps = 10
report_to = ["wandb"]
seed = 42
scale_rewards = "batch"
multi_objective_aggregation = "normalize_then_sum"
rs_grpo_beta = 4.0

[post_training.reward]
refine_constants = true
standardize_dataset = false
n_restarts = 4
init_noise_scale = 0.5
curriculum_init_noise_scale = false
complexity_weight = 0.05
simplipy_engine_name = "dev_7-3"

